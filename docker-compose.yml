services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend

    env_file:
      - ./backend/.env

    volumes:
      - ./backend/db.sqlite3:/app/db.sqlite3

    expose:
      - "8000"

    restart: unless-stopped


  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped
